name: Promote to Staging

# Manual trigger — engineer yang sadar memilih SHA mana yang di-promote
# dari dev ke staging. Ini deliberate: tidak ada auto-promote ke staging.
on:
  workflow_dispatch:
    inputs:
      sha_tag:
        description: "Image SHA tag to promote (e.g. abc1234). Leave empty to use latest dev tag."
        required: false
        type: string

jobs:
  promote:
    name: Promote to Staging
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Kalau SHA tidak di-input manual, ambil dari values-dev.yaml
      # (promote "apa yang sudah jalan di dev")
      - name: Resolve SHA tag
        id: tag
        run: |
          if [ -n "${{ inputs.sha_tag }}" ]; then
            echo "tag=${{ inputs.sha_tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(grep 'tag:' infra/helm/task-service/values-dev.yaml | head -1 | sed 's/.*tag: "\(.*\)"/\1/')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Promoting current dev tag: $TAG"
          fi

      - name: Update task-service values-staging.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ steps.tag.outputs.tag }}\"/" \
            infra/helm/task-service/values-staging.yaml

      - name: Update notification-service values-staging.yaml
        run: |
          sed -i "s/tag: .*/tag: \"${{ steps.tag.outputs.tag }}\"/" \
            infra/helm/notification-service/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/task-service/values-staging.yaml
          git add infra/helm/notification-service/values-staging.yaml
          git commit -m "chore: promote ${{ steps.tag.outputs.tag }} to staging [skip ci]"
          git push
