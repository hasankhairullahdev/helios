apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-service.fullname" . }}-secret
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
type: Opaque
# PENTING: Secret values TIDAK di-hardcode di sini.
# Di production, Secret ini di-manage oleh External Secrets Operator (Phase 9).
# Untuk local dev / testing, buat secret manual:
#
#   kubectl create secret generic helios-task-service-secret \
#     --from-literal=postgres-connection-string="Host=postgres;Database=tasks;Username=app;Password=<password>"
#
# Nilai "placeholder" di bawah hanya untuk helm template --dry-run agar tidak error.
# ArgoCD di production TIDAK akan apply Secret ini — ESO yang manage.
stringData:
  postgres-connection-string: {{ .Values.secrets.postgresConnectionString | quote }}
