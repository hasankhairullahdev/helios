apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-service.fullname" . }}
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  # Replicas dikontrol dari values per environment.
  # Kalau HPA aktif (staging/prod), nilai ini adalah initial replicas —
  # HPA yang akan scale up/down setelahnya.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-service.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart saat ConfigMap berubah — tanpa ini perubahan
        # env var dari ConfigMap tidak akan ter-apply ke pod yang sudah jalan
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Non-root security context — sesuai security rules
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: task-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "task-service.fullname" . }}-config
          env:
            # Secret database password dari Kubernetes Secret — BUKAN dari ConfigMap.
            # ConfigMap untuk non-sensitive config, Secret untuk credentials.
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-service.fullname" . }}-secret
                  key: postgres-connection-string

          # Liveness probe — Kubernetes restart pod kalau ini gagal
          # Path /healthz TIDAK cek DB — cukup "apakah proses masih hidup?"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: 10
            failureThreshold: 3

          # Readiness probe — Kubernetes remove pod dari load balancer kalau ini gagal
          # Path /readyz CEK koneksi DB — pod tidak dapat traffic sampai DB siap
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: 5
            failureThreshold: 3

          # Resource requests dan limits — WAJIB ada, tidak ada container tanpa ini.
          # requests: minimum yang dijamin tersedia untuk pod ini
          # limits: maximum yang boleh dipakai — kalau exceed, pod di-throttle (CPU)
          #         atau di-OOMKill (memory)
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}

          # Read-only root filesystem — container tidak bisa tulis ke filesystem
          # kecuali di mount points yang eksplisit. Ini hardening security.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # ASP.NET butuh temp directory untuk write — mount sebagai emptyDir
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
