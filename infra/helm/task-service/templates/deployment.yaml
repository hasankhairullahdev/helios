{{- if .Values.rollout.enabled }}
# ============================================================
# STAGING / PROD: Argo Rollouts — Canary Strategy
# ============================================================
# Rollout menggantikan Deployment sepenuhnya. API-nya compatible —
# selector, template, dan resources sama persis dengan Deployment.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "task-service.fullname" . }}
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: task-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "task-service.fullname" . }}-config
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-service.fullname" . }}-secret
                  key: postgres-connection-string
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

  strategy:
    canary:
      # Service yang di-split trafficnya
      canaryService: {{ include "task-service.fullname" . }}-canary
      stableService: {{ include "task-service.fullname" . }}-stable
      steps:
        # Step 1: kirim 10% traffic ke canary, pause 2 menit
        - setWeight: 10
        - pause: {duration: 2m}
        # Step 2: analisa error rate + latency canary pods
        - analysis:
            templates:
              - templateName: success-rate-and-latency
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
              - name: service-name
                value: task-service
        # Step 3: naikkan ke 50%, pause lagi
        - setWeight: 50
        - pause: {duration: 2m}
        # Step 4: analisa lagi sebelum full rollout
        - analysis:
            templates:
              - templateName: success-rate-and-latency
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
              - name: service-name
                value: task-service
        # Step 5: full rollout — semua traffic ke versi baru
        - setWeight: 100

{{- else }}
# ============================================================
# DEV: Plain Deployment (tidak perlu canary di dev)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-service.fullname" . }}
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
