---
# Default deny — blokir semua ingress traffic ke task-service pod
# kecuali yang eksplisit diizinkan di bawah.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-service.fullname" . }}-deny-all
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress

---
# Allow ingress dari Prometheus (untuk scrape /metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-service.fullname" . }}-allow-prometheus
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Label ini ada di Prometheus pod (kube-prometheus-stack default)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP

---
# Allow ingress dari namespace yang sama (notification-service tidak perlu
# akses task-service HTTP, tapi rule ini allow internal testing tools)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-service.fullname" . }}-allow-same-namespace
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Kubernetes otomatis label namespace dengan nama-nya sendiri
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 8080
          protocol: TCP
