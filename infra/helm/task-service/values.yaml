# values.yaml — DEFAULT values, JANGAN deploy langsung dari file ini.
# Selalu gunakan values-dev/staging/prod.yaml sebagai override.
#
# ATURAN: image.tag harus selalu di-set eksplisit.
# String kosong di sini memastikan chart tidak bisa deploy tanpa tag eksplisit —
# "fail closed" daripada accidentally deploy image yang salah.

image:
  repository: ghcr.io/hasankhairullahdev/task-service
  tag: ""   # WAJIB di-set di values-{env}.yaml atau via --set. Sengaja kosong!
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  rabbitmqHost: "rabbitmq"
  aspnetEnvironment: "Production"
  otelEndpoint: "http://otel-collector:4317"

secrets:
  # Placeholder — nilai asli di-inject oleh External Secrets Operator (prod)
  # atau kubectl create secret (local dev). JANGAN isi nilai asli di sini.
  postgresConnectionString: ""

probes:
  liveness:
    initialDelaySeconds: 10
  readiness:
    initialDelaySeconds: 15

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  prometheusRelease: kube-prometheus-stack
  interval: 30s
