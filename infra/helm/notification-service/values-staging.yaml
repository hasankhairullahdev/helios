image:
  tag: ""

replicaCount: 2

config:
  aspnetEnvironment: "Staging"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "300m"
    memory: "128Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

# Blue-green untuk staging/prod
rollout:
  enabled: true
  autoPromotionEnabled: false  # manual promote — engineer verify dulu sebelum cutover
