services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: app
      # CATATAN: di production, password ini harus dari secret manager.
      # Di local dev docker-compose, hardcode di sini acceptable.
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"   # AMQP protocol port (dipakai service)
      - "15672:15672" # Management UI — buka http://localhost:15672 untuk monitor queue
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # SERVICES
  # ============================================================

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    ports:
      - "5100:8080"
    environment:
      # 12-factor: semua config via env var
      ConnectionStrings__Postgres: "Host=postgres;Database=tasks;Username=app;Password=secret"
      RABBITMQ_HOST: rabbitmq
      ASPNETCORE_ENVIRONMENT: Development
      # GIT_SHA di-inject oleh CI nanti, kosong di local dev
      GIT_SHA: local
    depends_on:
      postgres:
        condition: service_healthy    # tunggu sampai postgres siap
      rabbitmq:
        condition: service_healthy    # tunggu sampai rabbitmq siap

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "5200:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      ASPNETCORE_ENVIRONMENT: Development
      GIT_SHA: local
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
